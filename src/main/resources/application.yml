spring:
  application:
    name: ftms-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ftms_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.ftms.backend: DEBUG

# ✅ Added for FtmsAccountsApiConfig (this fixes your config test)
api:
  version: v1

downstream:
  ftms:
    api:
      customers:
        url: http://localhost:8080/api/v1/customers/{customerId}
        timeout: 15